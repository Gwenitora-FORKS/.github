name: image badges

# Counts the distinct images of every loader on Docker Hub and publishes one
# shields.io endpoint file per loader on the "badges" branch. Runs after each
# loader workflow, once a day as a safety net, or manually. It never builds
# anything and pushing to "badges" starts no other workflow.
on:
  workflow_run:
    # Must match the "name:" field of each loader workflow.
    workflows: [vanilla, bukkit, spigot, paper, forge, neoforge, fabric, quilt, velocity, horizon]
    types: [completed]
  schedule:
    - cron: "30 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: image-badges
  cancel-in-progress: true

jobs:
  badges:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Count images on Docker Hub
        env:
          # Optional: authenticated registry calls get higher rate limits.
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: python3 scripts/count_images.py dist

      - name: Publish the badges branch
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "chore: update image count badges"
          git push -f -q "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
